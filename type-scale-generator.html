<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Type Scale Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f5f5f4;
      --panel:   #ffffff;
      --border:  #e7e5e4;
      --text:    #1c1917;
      --text2:   #57534e;
      --text3:   #a8a29e;
      --blue:    #2563eb;
      --blue-bg: #eff6ff;
      --green:   #15803d;
      --gbg:     #f0fdf4;
      --gborder: #bbf7d0;
      --r:       8px;
      --sans:    'Inter', system-ui, -apple-system, sans-serif;
      --mono:    'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .h-left { display: flex; align-items: center; gap: 10px; }
    .h-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
    .h-dot { color: var(--border); font-size: 18px; line-height: 1; }
    .h-sub { font-size: 12px; font-family: var(--mono); color: var(--text3); }
    .h-pill {
      font-size: 10px; font-family: var(--mono); font-weight: 500;
      padding: 2px 8px; border-radius: 100px;
      border: 1px solid var(--border); color: var(--text3);
    }

    /* ── Layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    aside {
      width: 260px; flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 28px;
    }

    .ctrl-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 12px;
    }

    /* Base size */
    .base-row {
      display: flex; align-items: baseline; gap: 4px;
      margin-bottom: 14px;
    }
    .base-input {
      font-size: 30px; font-weight: 600;
      font-family: var(--mono); color: var(--text);
      border: none; outline: none; background: transparent;
      width: 68px; letter-spacing: -0.03em; line-height: 1;
      -moz-appearance: textfield;
    }
    .base-input::-webkit-inner-spin-button,
    .base-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .base-unit { font-size: 15px; font-family: var(--mono); color: var(--text3); }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px;
      background: var(--border); border-radius: 2px;
      cursor: pointer; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--blue); border: 2px solid #fff;
      box-shadow: 0 0 0 1.5px var(--blue);
      transition: box-shadow 0.12s;
    }
    input[type="range"]:hover::-webkit-slider-thumb {
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
    }
    .range-marks {
      display: flex; justify-content: space-between;
      margin-top: 7px;
      font-size: 10px; font-family: var(--mono); color: var(--text3);
    }

    /* Ratio presets */
    .presets { display: flex; flex-direction: column; gap: 1px; }
    .preset {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 9px; border-radius: 6px;
      border: none; background: transparent; cursor: pointer;
      text-align: left; transition: background 0.1s;
      font-family: var(--sans);
    }
    .preset:hover { background: var(--bg); }
    .preset.on { background: var(--blue-bg); }
    .pname { font-size: 13px; font-weight: 500; color: var(--text2); }
    .preset.on .pname { color: var(--blue); }
    .pval { font-size: 11px; font-family: var(--mono); color: var(--text3); }
    .preset.on .pval { color: var(--blue); opacity: 0.65; }

    .custom-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 6px; padding: 7px 9px;
      border: 1px solid var(--border); border-radius: 6px;
      transition: border-color 0.15s;
    }
    .custom-row:focus-within { border-color: var(--blue); }
    .clabel { font-size: 12px; color: var(--text3); flex: 1; }
    .cinput {
      width: 56px; text-align: right;
      font-family: var(--mono); font-size: 12px;
      border: none; background: transparent; color: var(--text);
      outline: none; -moz-appearance: textfield;
    }
    .cinput::-webkit-inner-spin-button,
    .cinput::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Preview ── */
    .preview {
      flex: 1; overflow-y: auto;
      padding: 20px 32px 56px;
    }

    .scale-row {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      align-items: baseline;
      gap: 12px;
      padding: 10px;
      border-radius: 6px;
      transition: background 0.1s;
    }
    .scale-row:hover { background: rgba(0, 0, 0, 0.025); }

    .rkey {
      font-size: 11px; font-family: var(--mono); font-weight: 500;
      color: var(--text3); white-space: nowrap;
    }
    .scale-row.body-zone .rkey { color: var(--green); }

    .rtext {
      color: var(--text); line-height: 1.15;
      font-weight: 500; letter-spacing: -0.02em;
      /* font-size is set by JS — transition fires on in-place DOM patch */
      transition: font-size 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .rmeta { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .rpx { font-size: 11px; font-family: var(--mono); color: var(--text3); }
    .scale-row.body-zone .rpx { color: var(--green); }
    .rbadge {
      font-size: 9px; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 1px 5px; border-radius: 3px;
      background: var(--gbg); color: var(--green);
      border: 1px solid var(--gborder);
    }

    hr.sep { height: 1px; background: var(--border); border: none; margin: 20px 0; }

    /* CSS output */
    .out-box { border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .out-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 14px; background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .out-label { font-size: 11px; font-family: var(--mono); color: var(--text3); }
    .copy-btn {
      font-size: 11px; font-family: var(--mono); font-weight: 500;
      padding: 3px 10px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text2);
      cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { background: var(--text); color: #fff; border-color: var(--text); }
    .copy-btn.ok { background: var(--gbg); color: var(--green); border-color: var(--gborder); }

    .out-code {
      padding: 14px 16px;
      font-family: var(--mono); font-size: 11.5px; line-height: 1.75;
      overflow-x: auto; white-space: pre;
      color: var(--text2);
    }
    .t-sel  { color: var(--text3); }
    .t-prop { color: var(--blue); }
    .t-val  { color: #7c3aed; }
    .t-px   { color: #059669; }
  </style>
</head>
<body>

<header>
  <div class="h-left">
    <span class="h-title">Type Scale</span>
    <span class="h-dot">·</span>
    <span class="h-sub">modular scale generator</span>
  </div>
  <span class="h-pill">CSS variables</span>
</header>

<div class="main">
  <aside>
    <!-- Base size -->
    <div>
      <div class="ctrl-label">Base Size</div>
      <div class="base-row">
        <input class="base-input" id="baseNum" type="number" value="16" min="10" max="24" />
        <span class="base-unit">px</span>
      </div>
      <input type="range" id="baseRange" min="10" max="24" step="1" value="16" />
      <div class="range-marks"><span>10</span><span>16</span><span>24</span></div>
    </div>

    <!-- Scale ratio -->
    <div>
      <div class="ctrl-label">Scale Ratio</div>
      <div class="presets" id="presets">
        <button class="preset" data-r="1.067"><span class="pname">Minor Second</span><span class="pval">1.067</span></button>
        <button class="preset" data-r="1.125"><span class="pname">Major Second</span><span class="pval">1.125</span></button>
        <button class="preset" data-r="1.200"><span class="pname">Minor Third</span><span class="pval">1.200</span></button>
        <button class="preset on" data-r="1.250"><span class="pname">Major Third</span><span class="pval">1.250</span></button>
        <button class="preset" data-r="1.333"><span class="pname">Perfect Fourth</span><span class="pval">1.333</span></button>
        <button class="preset" data-r="1.414"><span class="pname">Aug. Fourth (√2)</span><span class="pval">1.414</span></button>
        <button class="preset" data-r="1.500"><span class="pname">Perfect Fifth</span><span class="pval">1.500</span></button>
        <button class="preset" data-r="1.618"><span class="pname">Golden Ratio</span><span class="pval">1.618</span></button>
      </div>
      <div class="custom-row">
        <span class="clabel">Custom</span>
        <input class="cinput" id="cinput" type="number" min="1.001" max="2.5" step="0.001" placeholder="1.333" />
      </div>
    </div>
  </aside>

  <main class="preview" id="preview"></main>
</div>

<script>
  // ── Scale steps ──────────────────────────────────────────────────────────────
  // exp=0 is the base size. Negative exps go smaller, positive go larger.
  // Names match Tailwind's text-size utilities for familiarity.
  const STEPS = [
    { key: 'xs',   exp: -2, text: 'Caption. Tooltip. Badge.' },
    { key: 'sm',   exp: -1, text: 'Secondary text, timestamps, metadata.' },
    { key: 'base', exp:  0, text: 'The foundation — body copy, inputs, and default UI text.' },
    { key: 'lg',   exp:  1, text: 'Pull quotes and comfortable prose. This is where reading happens.' },
    { key: 'xl',   exp:  2, text: 'Subheadings. Clear but not demanding.' },
    { key: '2xl',  exp:  3, text: 'Strong hierarchy. Scannable at a glance.' },
    { key: '3xl',  exp:  4, text: 'Page title. Commands attention.' },
    { key: '4xl',  exp:  5, text: 'Hero text. Four words.' },
    { key: '5xl',  exp:  6, text: 'Display.' },
  ];

  let base  = 16;
  let ratio = 1.25;

  // ── Helpers ─────────────────────────────────────────────────────────────────
  const round    = n  => Math.round(n * 100) / 100;
  const stepSize = s  => round(base * Math.pow(ratio, s.exp));
  const readable = px => px >= 14 && px <= 20;

  function cssText() {
    return ':root {\n' +
      STEPS.map(s => `  --text-${s.key}: ${stepSize(s)}px;`).join('\n') +
      '\n}';
  }

  function cssHtml() {
    return '<span class="t-sel">:root</span> {\n' +
      STEPS.map(s =>
        `  <span class="t-prop">--text-${s.key}</span>: ` +
        `<span class="t-val">${stepSize(s)}</span>` +
        `<span class="t-px">px</span>;`
      ).join('\n') +
      '\n}';
  }

  // ── Init: build DOM structure once ──────────────────────────────────────────
  // Rows are created once so CSS transition: font-size fires on subsequent patches.
  // (Full innerHTML teardown would create new elements, killing the transition.)
  function init() {
    const rows = STEPS.map(s => `
      <div class="scale-row" data-step="${s.key}">
        <span class="rkey">--text-${s.key}</span>
        <span class="rtext" data-rtext="${s.key}">${s.text}</span>
        <span class="rmeta">
          <span class="rpx" data-rpx="${s.key}"></span>
          <span class="rbadge" data-badge="${s.key}" hidden>body</span>
        </span>
      </div>`).join('');

    document.getElementById('preview').innerHTML = `
      <div>${rows}</div>
      <hr class="sep" />
      <div class="out-box">
        <div class="out-header">
          <span class="out-label">CSS output</span>
          <button class="copy-btn" id="copyBtn">Copy</button>
        </div>
        <div class="out-code" id="outCode"></div>
      </div>`;

    document.getElementById('copyBtn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(cssText());
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 2000);
    });
  }

  // ── Patch: update values in place ───────────────────────────────────────────
  function patch() {
    STEPS.forEach(s => {
      const sz = stepSize(s);
      const rz = readable(sz);

      document.querySelector(`[data-step="${s.key}"]`).classList.toggle('body-zone', rz);
      document.querySelector(`[data-rtext="${s.key}"]`).style.fontSize = sz + 'px';
      document.querySelector(`[data-rpx="${s.key}"]`).textContent = sz + 'px';

      const badge = document.querySelector(`[data-badge="${s.key}"]`);
      rz ? badge.removeAttribute('hidden') : badge.setAttribute('hidden', '');
    });

    document.getElementById('outCode').innerHTML = cssHtml();
  }

  // ── Controls ─────────────────────────────────────────────────────────────────
  const baseNum   = document.getElementById('baseNum');
  const baseRange = document.getElementById('baseRange');

  // Slider and number input stay in sync bidirectionally
  baseNum.addEventListener('input', () => {
    const v = Math.max(10, Math.min(24, parseInt(baseNum.value, 10) || 16));
    base = v;
    baseRange.value = v;
    patch();
  });
  baseRange.addEventListener('input', () => {
    base = parseInt(baseRange.value, 10);
    baseNum.value = base;
    patch();
  });

  // Ratio presets
  document.getElementById('presets').addEventListener('click', e => {
    const btn = e.target.closest('.preset');
    if (!btn) return;
    ratio = parseFloat(btn.dataset.r);
    document.getElementById('cinput').value = '';
    document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b === btn));
    patch();
  });

  // Custom ratio
  document.getElementById('cinput').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    if (v >= 1.001 && v <= 2.5) {
      ratio = v;
      document.querySelectorAll('.preset').forEach(b => b.classList.remove('on'));
      patch();
    }
  });

  // ── Boot ─────────────────────────────────────────────────────────────────────
  init();
  patch();
</script>
</body>
</html>
